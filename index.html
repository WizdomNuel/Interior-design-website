<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FDD | Awka</title>
    
    <!-- Google Fonts: Playfair Display for headings, Lato for body -->
    <!-- Note: Sohne and Graphik are premium fonts. Consider licensing from Grilli Type or using alternatives -->
    <!-- For now using Playfair Display (serif) for big headings and Lato (sans) for body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // FDD Brand System - Dark Mode Primary
              'fdd-dark-bg': '#1b1b1b',
              'fdd-dark-surface': '#232323',
              'fdd-dark-text-primary': '#FFFFFF',
              'fdd-dark-text-secondary': '#BDBDBD',
              
              // FDD Brand System - Orange Accents
              'fdd-accent-primary': '#fac344',
              'fdd-accent-secondary': '#ac7227',
              
              // FDD Brand System - Light Mode
              'fdd-light-bg': '#FFFFFF',
              'fdd-light-surface': '#e2e2e2',
              'fdd-light-text-primary': '#1b1b1b',
              'fdd-light-text-secondary': '#6E6E6E',
              
              // Legacy colors for backward compatibility
              primary: '#333333',
              secondary: '#666666',
              accent: '#FFFFFF',
              offwhite: '#fafaf9',
              surface: '#ffffff',
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Lato"', 'sans-serif'],
            },
            container: {
              center: true,
              padding: '2rem',
              screens: {
                sm: '640px',
                md: '768px',
                lg: '1024px',
                xl: '1280px',
              },
            },
          },
        },
      }
    </script>
    <style>
      /* FDD Design Tokens - CSS Variables */
      :root,
      :not(.dark) {
        /* Light Mode (Default) */
        --bg-primary: #FFFFFF;
        --bg-secondary: #e2e2e2;
        --text-primary: #1b1b1b;
        --text-secondary: #6E6E6E;
        --accent-primary: #ac7227;
        --accent-secondary: #fac344;
      }

      /* Dark Mode */
      .dark {
        --bg-primary: #1b1b1b;
        --bg-secondary: #232323;
        --text-primary: #FFFFFF;
        --text-secondary: #BDBDBD;
        --accent-primary: #fac344;
        --accent-secondary: #ac7227;
      }

      /* Smooth scrolling for anchor links */
      html {
        scroll-behavior: smooth;
      }
      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      /* Custom Scrollbar for Premium Feel */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-secondary);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--accent-primary);
        border-radius: 0;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent-secondary);
      }
      ::selection {
        background: var(--accent-primary);
        color: var(--text-primary);
      }

      /* Preload overlay to prevent flash before loading screen */
      #app-preload {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9998;
        background-color: var(--bg-primary);
        transition: opacity 0.4s ease;
        opacity: 1;
      }

      #app-preload.hidden {
        pointer-events: none;
        opacity: 0;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "framer-motion": "https://esm.sh/framer-motion@^12.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.570.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="app-preload"></div>
    <div id="root"></div>
    <script>
      // Initialize preload immediately
      try {
        const preload = document.getElementById('app-preload');
        if (preload) {
          preload.style.backgroundColor = 'var(--bg-primary)';
        }
      } catch (e) {
        // ignore
      }
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
